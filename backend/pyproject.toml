[project]
name = "legalease-ai-backend"
version = "0.1.0"
description = "LegalEase AI — FastAPI backend with PostgreSQL + FAISS for AI-powered legal assistance"
authors = [
    { name = "Saadullah", email = "saadullahlakho@gmail.com" },
    { name = "Ali Mehmood Khan" },
    { name = "Muhammad Uzair Siddique" },
]
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# B008 (function call in a default argument) is how FastAPI declares
# dependencies and request parameters (`db: Session = Depends(get_db)`).
# Mark FastAPI's helpers as safe so B008 still catches any other call.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Query",
    "fastapi.Body", "fastapi.Path", "fastapi.Header", "fastapi.Cookie",
    "fastapi.Security",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
python_files = ["test_*.py"]
addopts = "-ra -q --cov=app --cov-report=term-missing"
